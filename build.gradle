// build.gradle (Project level)
plugins {
    id 'com.android.application' version '31.0.0' apply true
    id 'org.jetbrains.kotlin.android' version '1.6.10' apply true
}

android {
    namespace 'com.vijay.aimagicremote'
    compileSdk 33
    targetSdk 33

    defaultConfig {
        applicationId "com.vijay.aimagicremote"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
    
        // Enable Java 8 language features
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize'), 'proguard-rules.pro'
        }
        debug {
            // Auto-generated debug signing config
        }
    }
    
    // Essential for Bluetooth and TV features
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {

    // AndroidX foundations
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
    implementation 'androidx.media3:media3-exoplayer:1.3.0'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Jetpack Compose UI (modern Android UI)
    implementation 'androidx.compose.ui:ui:1.3.0'
    implementation 'androidx.compose.material:material:1.3.0'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.3.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.1'
    implementation 'androidx.activity:activity-compose:1.6.1'

    // Kotlin coroutines and flow
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    // Android TV Remote Protocol dependencies
    // OkHttp for HTTP/HTTPS client
    implementation 'com.squareup.okhttp:okhttp:2.7.0'

    // Protobuf (if needed for ATRPv2)
    // implementation 'com.google.protobuf:protobuf-java:3.21.7'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1'

    // Material Components (legacy)
    implementation 'com.google.android.material:material:1.7.0'

    // Coil for image loading (if needed)
    implementation 'coil-ktx:2.2.0'

    // Permission handling
    implementation 'com.guolife:permissionhelper:1.1.0'
}