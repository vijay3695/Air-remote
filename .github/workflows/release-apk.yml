name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          chmod +x ./gradlew
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee gradle-build.log; then
              exit 0
            fi
            if ! grep -Eiq 'Plugin .* was not found|Could not resolve|Could not (GET|HEAD)|Could not download|Temporary failure in name resolution|UnknownHostException|Connection timed out' gradle-build.log; then
              echo "Build failure is not a recognized transient dependency-resolution error; stopping without retry."
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Gradle dependency resolution failed after 3 attempts."
              exit 1
            fi
            echo "Transient Gradle dependency failure on attempt $attempt; retrying after a short delay..."
            sleep $((attempt * 20))
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14