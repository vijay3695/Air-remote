name: Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Create release keystore
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias airremote -keyalg RSA -keysize 2048 -validity 10000 -storepass airremote -keypass airremote -dname "CN=Air Remote, O=Vijay, C=IN"
          echo "storeFile=release.keystore" > keystore.properties
          echo "storePassword=airremote" >> keystore.properties
          echo "keyAlias=airremote" >> keystore.properties
          echo "keyPassword=airremote" >> keystore.properties
      - name: Build release APK
        run: ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk